<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>IPA Catalog</title>
  <style>
    :root {
      --bg: #080d18;
      --bg2: #0f1b33;
      --panel: rgba(20, 32, 58, 0.86);
      --card: #142341;
      --line: #22365f;
      --text: #eef4ff;
      --muted: #97a8ce;
      --primary: #46b9ff;
      --primary2: #3768ff;
      --ok: #2ed0a8;
      --danger: #ff6786;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", Tahoma, sans-serif; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(900px 420px at 100% -10%, #23427f 0%, transparent 55%),
        radial-gradient(700px 350px at -10% 5%, #1f3062 0%, transparent 60%),
        linear-gradient(180deg, var(--bg2), var(--bg) 35%);
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: 12px 12px calc(90px + var(--safe-bottom));
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      margin-bottom: 10px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #0f1b33;
      border: 1px solid #365285;
      box-shadow: 0 10px 22px rgba(11, 32, 71, 0.42);
      object-fit: cover;
      flex-shrink: 0;
    }

    .title { font-size: 20px; font-weight: 700; margin: 0; line-height: 1.1; }
    .subtitle { font-size: 12px; color: var(--muted); margin-top: 3px; }

    .search-wrap {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      margin-bottom: 12px;
    }

    .search {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(15, 28, 53, 0.9);
      color: var(--text);
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s ease;
    }

    .search:focus { border-color: #4b7ce5; }

    .btn {
      border: 0;
      border-radius: 12px;
      color: white;
      padding: 0 14px;
      font-weight: 600;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      box-shadow: 0 10px 20px rgba(49, 104, 255, .25);
      cursor: pointer;
      transition: transform .12s ease, opacity .2s ease;
      min-height: 44px;
    }
    .btn:active {
      transform: scale(.97);
      box-shadow: 0 0 0 4px rgba(80, 146, 255, 0.25), 0 10px 20px rgba(49, 104, 255, .25);
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      border: 1px solid var(--line);
      color: var(--muted);
      background: rgba(15, 28, 53, 0.8);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      transition: .2s ease;
    }
    .chip.active { color: #fff; border-color: #4f80ec; background: #1d2f58; }

    .section-title {
      margin: 14px 2px 10px;
      font-size: 14px;
      color: #d8e6ff;
      letter-spacing: .3px;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .card {
      position: relative;
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #16284c, #111f3c);
      box-shadow: 0 8px 20px rgba(5, 14, 31, .22);
      transform: translateY(0);
      transition: transform .18s ease, box-shadow .25s ease, border-color .2s ease;
      overflow: hidden;
    }
    .card:active { transform: scale(.985); }
    .card:hover { box-shadow: 0 14px 28px rgba(5, 14, 31, .32); border-color: #36528e; }
    .card::after {
      content: "";
      position: absolute;
      inset: -35%;
      background: radial-gradient(circle at center, rgba(120, 188, 255, 0.18), transparent 56%);
      opacity: 0;
      transition: opacity .25s ease;
      pointer-events: none;
    }
    .card:active::after { opacity: 1; }

    .app-icon, .app-icon-empty {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      border: 1px solid #314a7a;
      object-fit: cover;
      background: #132547;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #b8d7ff;
    }

    .meta-title { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.2; }
    .meta-sub { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .meta-row { margin-top: 6px; color: #d2ddf6; font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

    .ghost-btn {
      border: 1px solid var(--line);
      background: #1b315d;
      color: #dbe9ff;
      border-radius: 11px;
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
      min-width: 82px;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .12s ease, background .2s ease;
    }
    .ghost-btn:active {
      transform: scale(.97);
      box-shadow: 0 0 0 3px rgba(86, 146, 255, 0.22);
    }
    .ghost-btn.primary {
      border: 0;
      background: linear-gradient(135deg, #4aa8ff, #3f69ff);
      color: #fff;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      color: #b8c8eb;
      border: 1px dashed #2b4271;
      background: rgba(15, 28, 53, 0.5);
      border-radius: 16px;
      padding: 22px 16px;
      margin-top: 14px;
    }
    .empty strong { color: #ebf3ff; display: block; margin-bottom: 6px; }

    .detail {
      display: none;
      animation: fade .25s ease;
    }
    .detail.active { display: block; }
    .back {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      color: #cfe0ff;
      background: #122349;
      font-size: 12px;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 10px;
    }
    .hero {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    .hero h2 { margin: 0; font-size: 20px; }
    .hero .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .desc {
      margin: 12px 0;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(16, 30, 56, .78);
      color: #d5e3ff;
      font-size: 14px;
      line-height: 1.5;
    }
    .facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .fact {
      border: 1px solid var(--line);
      background: rgba(16, 29, 55, .78);
      border-radius: 12px;
      padding: 10px;
      font-size: 12px;
      color: #c8d8f6;
    }
    .fact b { color: #f2f7ff; display: block; margin-bottom: 3px; font-size: 13px; }
    .shots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .shot {
      min-height: 72px;
      border: 1px solid #2c4473;
      border-radius: 10px;
      background: linear-gradient(160deg, #1a315c, #122346);
      font-size: 11px;
      color: #c7dbff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px;
      overflow: hidden;
    }
    .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      margin: 0 auto;
      max-width: 560px;
      background: rgba(10, 18, 35, 0.93);
      border-top: 1px solid #273d68;
      backdrop-filter: blur(12px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 10px calc(8px + var(--safe-bottom));
      z-index: 50;
    }
    .nav-btn {
      color: #8ea5d5;
      font-size: 11px;
      border: 0;
      background: transparent;
      border-radius: 10px;
      padding: 8px 2px;
      cursor: pointer;
      transition: .2s ease;
    }
    .nav-btn.active { color: #ecf3ff; background: #17305e; }

    .skeleton {
      position: relative;
      overflow: hidden;
      background: #102043;
      border: 1px solid #23395f;
      border-radius: 14px;
      min-height: 84px;
    }
    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent);
      animation: shine 1.15s linear infinite;
    }

    @keyframes shine {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }
    @keyframes fade {
      from { opacity: .5; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <img class="logo" src="/webapp/logo.svg" alt="logo">
      <div>
        <h1 class="title">IPA Catalog</h1>
        <div class="subtitle">App Store style Mini App for games and apps</div>
      </div>
    </div>

    <main id="screen-home">
      <div class="search-wrap">
        <input id="searchInput" class="search" placeholder="Search apps & games" />
        <button id="searchBtn" class="btn">Search</button>
      </div>

      <div id="typeFilter" class="chips">
        <button class="chip active" data-type="">Все</button>
        <button class="chip" data-type="game">Игры</button>
        <button class="chip" data-type="app">Приложения</button>
      </div>

      <div id="tabFilter" class="chips">
        <button class="chip active" data-tab="popular">Популярные</button>
        <button class="chip" data-tab="new">Новые</button>
        <button class="chip" data-tab="games">Игры</button>
        <button class="chip" data-tab="apps">Приложения</button>
      </div>

      <div class="section-title" id="sectionTitle">Популярные</div>
      <div id="list" class="grid"></div>
      <div id="empty" class="empty" style="display:none;">
        <strong>Nothing found</strong>
        Try another name or browse popular apps
      </div>
    </main>

    <main id="screen-detail" class="detail">
      <button id="backBtn" class="back">← Назад</button>
      <div id="detailContent"></div>
    </main>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-nav="home">Home</button>
    <button class="nav-btn" data-nav="search">Search</button>
    <button class="nav-btn" data-nav="favorites">Favorites</button>
    <button class="nav-btn" data-nav="profile">Profile</button>
  </nav>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram?.WebApp || null;
    if (tg) tg.ready();

    const state = {
      items: [],
      query: "",
      type: "",
      tab: "popular",
      nav: "home",
      favorites: new Set(JSON.parse(localStorage.getItem("ipa_favorites") || "[]"))
    };

    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const sectionTitleEl = document.getElementById("sectionTitle");
    const screenHomeEl = document.getElementById("screen-home");
    const screenDetailEl = document.getElementById("screen-detail");
    const detailContentEl = document.getElementById("detailContent");
    const searchInputEl = document.getElementById("searchInput");
    const searchBtnEl = document.getElementById("searchBtn");
    const backBtnEl = document.getElementById("backBtn");

    function saveFavorites() {
      localStorage.setItem("ipa_favorites", JSON.stringify([...state.favorites]));
    }

    function itemById(id) {
      return state.items.find(x => Number(x.id) === Number(id));
    }

    function skeletonList() {
      listEl.innerHTML = Array.from({length: 6}).map(() => `<div class="skeleton"></div>`).join("");
      emptyEl.style.display = "none";
    }

    function initials(name) {
      return (name || "?").trim().split(" ").slice(0, 2).map(x => x[0] || "").join("").toUpperCase();
    }

    function iconHtml(item) {
      if (item.icon_url) return `<img class="app-icon" src="${item.icon_url}" alt="icon">`;
      return `<div class="app-icon-empty">${initials(item.name)}</div>`;
    }

    function downloadAction(item) {
      return `<button class="ghost-btn primary" data-action="download" data-id="${item.id}">Скачать</button>`;
    }

    function cardHtml(item) {
      const fav = state.favorites.has(item.id) ? "★" : "☆";
      const typeText = item.type === "app" ? "App" : "Game";
      const subtitle = item.description || `${typeText} · ${item.category || "General"}`;
      return `
        <article class="card">
          ${iconHtml(item)}
          <div>
            <h3 class="meta-title">${item.name}</h3>
            <div class="meta-sub">${subtitle}</div>
            <div class="meta-row">
              <span>⭐ ${item.rating_avg || 0}</span>
              <span>(${item.rating_count || 0})</span>
              <span>📦 ${item.size || "N/A"}</span>
              <span>🛠 ${item.version || "N/A"}</span>
            </div>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-end;">
            <button class="ghost-btn" data-action="open" data-id="${item.id}">Открыть</button>
            <button class="ghost-btn" data-action="fav" data-id="${item.id}">${fav}</button>
          </div>
        </article>
      `;
    }

    function applyFilters(items) {
      let out = [...items];
      if (state.type) out = out.filter(x => (x.type || "").toLowerCase() === state.type);
      if (state.query) {
        const q = state.query.toLowerCase();
        out = out.filter(x => (x.name || "").toLowerCase().includes(q));
      }

      if (state.nav === "favorites") {
        out = out.filter(x => state.favorites.has(x.id));
      } else if (state.tab === "popular") {
        out.sort((a, b) => (b.rating_count || 0) - (a.rating_count || 0) || (b.rating_avg || 0) - (a.rating_avg || 0));
      } else if (state.tab === "new") {
        out.sort((a, b) => (b.id || 0) - (a.id || 0));
      } else if (state.tab === "games") {
        out = out.filter(x => (x.type || "").toLowerCase() === "game");
      } else if (state.tab === "apps") {
        out = out.filter(x => (x.type || "").toLowerCase() === "app");
      }

      return out;
    }

    function sectionTitle() {
      if (state.nav === "favorites") return "Избранное";
      if (state.nav === "profile") return "Профиль";
      const map = {
        popular: "Популярные",
        new: "Новые",
        games: "Игры",
        apps: "Приложения"
      };
      return map[state.tab] || "Каталог";
    }

    function renderList() {
      const items = applyFilters(state.items);
      sectionTitleEl.textContent = sectionTitle();

      if (state.nav === "profile") {
        listEl.innerHTML = `
          <div class="empty" style="display:block;">
            <strong>Profile</strong>
            Telegram ID: ${tg?.initDataUnsafe?.user?.id || "unknown"}<br>
            Favorites: ${state.favorites.size}
          </div>
        `;
        emptyEl.style.display = "none";
        return;
      }

      listEl.innerHTML = items.map(cardHtml).join("");
      emptyEl.style.display = items.length ? "none" : "block";
    }

    function parseScreenValue(v) {
      if (!v || typeof v !== "string") return null;
      if (v.startsWith("http://") || v.startsWith("https://") || v.startsWith("/")) return { type: "url", value: v };
      // Backward compatibility: old API may still return raw Telegram file_id.
      return { type: "url", value: `/api/media/telegram/${encodeURIComponent(v)}` };
    }

    function detailHtml(item) {
      const screens = (item.screenshots || []).map(parseScreenValue).filter(Boolean);
      const screensHtml = screens.length
        ? screens.map(s =>
            `<div class="shot"><img src="${s.value}" alt="shot"></div>`
          ).join("")
        : `<div class="shot">No screenshots</div><div class="shot">No screenshots</div><div class="shot">No screenshots</div>`;

      return `
        <div class="hero">
          ${iconHtml(item)}
          <div>
            <h2>${item.name}</h2>
            <div class="meta">⭐ ${item.rating_avg || 0} (${item.rating_count || 0})</div>
          </div>
        </div>

        <div class="desc">${item.description || "Описание пока не заполнено."}</div>

        <div class="facts">
          <div class="fact"><b>Version</b>${item.version || "N/A"}</div>
          <div class="fact"><b>Size</b>${item.size || "N/A"}</div>
          <div class="fact"><b>Developer</b>${item.developer || "N/A"}</div>
          <div class="fact"><b>Category</b>${item.category || "N/A"}</div>
        </div>

        <div class="section-title">Скриншоты</div>
        <div class="shots">${screensHtml}</div>

        <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
          ${downloadAction(item)}
          ${item.download_url ? `<a class="ghost-btn" href="${item.download_url}" target="_blank" rel="noreferrer">Скачать по ссылке</a>` : ""}
          <button class="ghost-btn" data-action="fav" data-id="${item.id}">${state.favorites.has(item.id) ? "Убрать из избранного" : "В избранное"}</button>
        </div>
      `;
    }

    async function loadItems() {
      skeletonList();
      const response = await fetch("/api/items?limit=120");
      const data = await response.json();
      state.items = data.items || [];
      renderList();
    }

    async function openDetail(id) {
      const response = await fetch(`/api/items/${id}`);
      if (!response.ok) return;
      const item = await response.json();
      detailContentEl.innerHTML = detailHtml(item);
      screenHomeEl.style.display = "none";
      screenDetailEl.classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function closeDetail() {
      screenDetailEl.classList.remove("active");
      screenHomeEl.style.display = "";
      renderList();
    }

    function applyTypeChipUI() {
      document.querySelectorAll("#typeFilter .chip").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.type === state.type);
      });
    }

    function applyTabChipUI() {
      document.querySelectorAll("#tabFilter .chip").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === state.tab);
      });
    }

    function applyBottomNavUI() {
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.nav === state.nav);
      });
    }

    function setNav(nav) {
      state.nav = nav;
      applyBottomNavUI();
      renderList();
    }

    function doSearch() {
      state.query = searchInputEl.value.trim();
      renderList();
    }

    function toggleFavorite(id) {
      if (state.favorites.has(id)) state.favorites.delete(id);
      else state.favorites.add(id);
      saveFavorites();
      if (screenDetailEl.classList.contains("active")) {
        openDetail(id);
        return;
      }
      renderList();
    }

    async function startDownload(id) {
      try {
        const response = await fetch(`/api/items/${id}/download?via=bot`);
        if (!response.ok) return;
        const data = await response.json();
        if (!data || !data.url) return;

        if (tg && typeof tg.openLink === "function") {
          tg.openLink(data.url);
          return;
        }
        window.open(data.url, "_blank");
      } catch (_) {}
    }

    document.getElementById("typeFilter").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      state.type = btn.dataset.type || "";
      applyTypeChipUI();
      renderList();
    });

    document.getElementById("tabFilter").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      state.tab = btn.dataset.tab || "popular";
      applyTabChipUI();
      renderList();
    });

    document.querySelector(".bottom-nav").addEventListener("click", (e) => {
      const btn = e.target.closest(".nav-btn");
      if (!btn) return;
      closeDetail();
      setNav(btn.dataset.nav || "home");
    });

    searchBtnEl.addEventListener("click", doSearch);
    searchInputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
    backBtnEl.addEventListener("click", closeDetail);

    listEl.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action][data-id]");
      if (!btn) return;
      const id = Number(btn.dataset.id);
      const action = btn.dataset.action;
      if (!id) return;
      if (action === "open") return openDetail(id);
      if (action === "fav") return toggleFavorite(id);
      if (action === "download") return startDownload(id);
    });

    detailContentEl.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action][data-id]");
      if (!btn) return;
      const id = Number(btn.dataset.id);
      const action = btn.dataset.action;
      if (!id) return;
      if (action === "fav") return toggleFavorite(id);
      if (action === "download") return startDownload(id);
    });

    applyTypeChipUI();
    applyTabChipUI();
    applyBottomNavUI();
    loadItems();
  </script>
</body>
</html>
